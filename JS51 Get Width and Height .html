<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get Width And Height</title>
  </head>

  <style>
    .color {
      background-color: yellow;
      color: red;
      font-size: 20px;
      font-weight: bolder;
    }

    .dim {
      border: 1px solid red;
      padding: 100px;
    }
  </style>

  <body>
    <div id="box" class="color dim">
      <p>This is a dummy text!</p>
    </div>

    <script>
      let a = document.getElementById("box");

      // offset or client
      // offset my border margin padding sb include hota ha
      // client my border or margin include ni hota srf padding include hota ha

      let width = a.offsetWidth;
      let height = a.offsetHeight;

      console.log(width);
      console.log(height);

      let width1 = a.clientWidth;
      let height1 = a.clientHeight;

      console.log(width1);
      console.log(height1);
    </script>
  </body>
</html>
