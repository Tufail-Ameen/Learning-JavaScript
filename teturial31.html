<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MORE ON CSS SELECTORS</title>
    <style>
        h1 {
            background-color: black;
            color: white;
            font-weight: bolder;
            text-align: center;
            font-size: 50px;
        }

        /* div li p {
            background-color: yellow;
            font-weight: bold;
        } */

        /* div > p {
            background-color: yellow;
            font-weight: bold;
        } */

        div+p {
            background-color: yellow;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>This is more on selectors</h1>
    <div class="container">
        <div class="row">
            <ul>
                <li class="item">
                    <p>this is another paragraph inside li</p>
                </li>
                <li>this is not affected li</li>
            </ul>
            <p>This is a Paragragh</p>
        </div>

        <p>This is another Paragraph</p>
    </div>

    <p>This is outermost Pagragraph</p>
</body>

</html>
