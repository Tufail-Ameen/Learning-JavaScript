        async function mian() {
            let Lahore_Weather = new Promise((resolve, reject) => {
                setTimeout(() => {
                    resolve("25 deg")
                }, 5000);
            })

            let Karachi_Weather = new Promise((resolve, reject) => {
                setTimeout(() => {
                    resolve("28 deg")
                }, 7000);

            })

            // await krwata jb tk 1 promice ke value resolve ni hoti agy ni jana ... phly 1st promice resolve kro than agy jana ... mtlb promice ke exiciution ko rok dea 1 trha ka.

            let Lahore = await Lahore_Weather
            let karachi = await Karachi_Weather
            return [Lahore_Weather, Karachi_Weather]
        }

        console.log("Welcome to weather control room")
