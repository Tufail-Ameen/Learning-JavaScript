<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scope and conditionals</title>
</head>

<body>
    <script>

        // Scope
        // 1 Block Scope
        // 2 Function Scope
        // 3 Global Scope
        // var or let ko kha access kr skty kha ni agr hm bracket ky bhir bnay gy var let ya cont ko
        // to us ka scope global ho ga jha mrzi access kr skty

        // Redeclair
        var string1 = "This is a String";
        var string1 = "This is a String2"
        console.log(string1);

        let a = "u";
        console.log(a);

        // let a=500 a is already declair but block ky andr declair ho jay ga

        {
            let a = 500;
            console.log(a);
        }

        // Constant
        const b = "This can not b changed";
        // b = "I want to change this constant"
        //  so pta chla hm constant ko change ni kr skty
        console.log(b);

        // IF ELSE 
        let age = "15";
        if (age > 18) {
            console.log("You can drink Wine");
        }
        else {
            console.log("You can drink Water");
        }



        // ELSE IF
        let payment = "65000";
        if (payment > 75000) {
            console.log("you are winner");
        }

        else if (payment == 75000) {
            console.log("You are right");
        }

        else if (payment < 75000) {
            console.log("you are bad boy");
        }




        const cups = 45;
        switch (cups) {
            case 4:
                console.log("value of cups is 4");
                break;

            case 41:
                console.log("value of cups is 41");
                break;

            case 42:
                console.log("value of cups is 42");
                break;

            case 43:
                console.log("value of cups is 43");
                break;

            default:
                console.log("none of 4, 41, 42, 43");
                break;
        }


    </script>
</body>

</html>
