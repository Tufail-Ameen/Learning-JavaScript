<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ids and Classes in HTML</title>
</head>

<body>
    <!-- # is for id  -->
    <!-- . is for class -->
    <!-- Emmet take div tag as default -->
    <div id="mian" class="tufail"></div>

    <!-- Creating Multiple Elements using Emmet -->
    <!-- .mian.tufail.arshi.ameen than press tab -->
    <div class="mian tufail arshi ameen"></div>

    <!-- if we want 4 same -->
    <!-- .mian.tufail.arshi.ameen*4 -->
    <div class="mian tufail arshi ameen"></div>
    <div class="mian tufail arshi ameen"></div>
    <div class="mian tufail arshi ameen"></div>
    <div class="mian tufail arshi ameen"></div>




    
    <h3>Ids and Classes in HTML</h3>
    <div id="mainBox" class="redBg blackBorder">
        This is Main Box
    </div>
    <span class="redBg">
    </span>
    <!-- Emmet -->
    <span id="mainbox"></span>
    <h class="redbg"></h>

    <!-- Emmet Takes div as default -->
    <div id="myid"></div>
    <div class="redbg"></div>
    <!-- Creating Multiple Elements using Emmet -->
    <!-- spam.myclass1.myclass2.myclass3  + <Tab>               -->
    <spam class="myclass1 myclass2 myclass3"></spam>
    <!-- if we want 4 same -->
    <!-- spam.myclass1.myclass2.myclass3*4 -->
    <spam class="myclass1 myclass2 myclass3">First</spam>
    <spam class="myclass1 myclass2 myclass3">Second</spam>
    <spam class="myclass1 myclass2 myclass3">Third</spam>
    <spam class="myclass1 myclass2 myclass3">Fourth</spam>
</body>
</html>
