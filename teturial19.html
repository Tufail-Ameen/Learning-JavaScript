<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background colors and Borders</title>
</head>
<style>
    #firstpara {
        background-color: red;
        height: 120px;
        width: 1000px;
        /* we can write these three line in 1 line  */
        /* border: 4px;
    border-color: blue;
    border-style: solid; */
        border: 4px blue solid;
        border-radius: 13px;
    }

    #secondpara {
        background-color: rgb(14, 231, 6);
        height: 120px;
        width: 1000px;
        border-top: 8px red solid;
        border-bottom: 8px blue solid;
        border-right: 8px brown solid;
        border-left: 8px purple solid;
    }

    #thirdpara {
        height: 900px;
        width: 1100px;
        background-image: url(https://images.hindustantimes.com/img/2022/02/20/1600x900/Deepika_Padukone_Gehraiyaan_1645337273884_1645337274005.jpg);
        border: 8px solid red;
        background-repeat: no-repeat;
        /* background-position: 192px 34px; */
        /* background-position: center center; */
        /* background-position: center top; */
        /* background-position: center center; */
        /* background-position: center right; */
        /* background-position: center left; */
        background-position: bottom right;
    }
    
</style>

<body>
    <h1>This is heading</h1>
    <p id="firstpara">This is a Paragraph</p>
    <p id="secondpara">This is my second Paragraph</p>
    <p id="thirdpara">This is my Third Paragraph</p>
</body>

</html>
