<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mouse Event</title>
</head>
<style>
    .box {
        height: 100px;
        width: 100px;
        background-color: blueviolet;
        margin: 10px 10px;
        display: inline-block;
    }
</style>

<body>
    <!-- inline events lga ky krty hain test sb pr -->

    <div class="box" onclick="fun()"></div>
    <div class="box" oncontextmenu="fun1()"></div>
    <div class="box" ondblclick="fun2()"></div>
    <div class="box" onmousedown="fun3()"></div>
    <div class="box" onmouseup="fun4()"></div>
    <div class="box" onmouseover="fun5()"></div>
    <div class="box" onmouseout="fun6()"></div>


    <script>
        function fun() {
            alert("On Click Event");
        }

        function fun1() {
            alert("Right Click Event");
        }

        function fun2() {
            alert("Double Click Event");
        }

        // nearly equal to click event
        function fun3() {
            alert("Mouse Down Event");
        }

        // mouseup ya us wkt chly ga jb ap click kr ky chor do gy
        function fun4() {
            alert("Mouse Up Event");
        }

        function fun5() {
            alert("Mouse Over Event");
        }

        function fun6() {
            alert("Mouse Out Event");
        }


    </script>
</body>

</html>
