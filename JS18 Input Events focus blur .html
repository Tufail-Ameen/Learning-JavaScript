<body>

    <form action="">
        <input type="text" id="myinput">
    </form>
    <script>
        // Focus Event or blur Event ?
        let a = document.getElementById("myinput");

        a.addEventListener("focus", myFocusFunction);
        a.addEventListener("blur", myBlurFunction);

        function myFocusFunction() {
            a.style.background = "yellow"
        };

        function myBlurFunction() {
            a.style.backgroundColor = "white"
        };

        // Change Event ?

        // jb jb ap value change kro gy tb tb print ho ga bs...
        // agr same value pr dbra click kro gy to ni ho ga change...

        a.addEventListener("change", function () {
            console.log(this.value);
        });
