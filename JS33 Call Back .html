        // ab ma chahta hn wo onload function ky sth koi custom function b load kro
        // ma chahta hn ma custom function run kro


        function loadScript(src, callback) {
            var script = document.createElement('script');
            script.src = src;
            script.onload = function () {
                console.log("Loaded Script with SRC " + src);
                callback();
            }
            document.body.appendChild(script);
        }

        function hello() {
            console.log("Mian g Attach Function")
