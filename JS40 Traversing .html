<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traversing Elements</title>
</head>

<body>
    <ul>
        <li id="intro">list 1</li>
        <li>list 2</li>
        <li>list 3</li>
        <li>list 4</li>
    </ul>

    <ul id="duction">
        <li>list a</li>
        <li>list b</li>
        <li>list c</li>
        <li>list d</li>
    </ul>

    <ul>
        <li>list 117</li>
        <li id="memes">list 118</li>
        <li>list 119</li>
        <li>list 120</li>
    </ul>

    <script>
        // Traversing Elements is indirect selection.         kis trha hm child sy parent ko select kr skty hain and vise versa
        // Child sy parent select
        let mian = document.getElementById("intro");
        let tufail = mian.parentElement;
        console.log(tufail);

        // parent sy child select
        let x = document.getElementById("duction");
        let y = x.firstElementChild;
        let z = x.lastElementChild;
        let a = x.children;
        console.log(y);

        // Siblings select
        let g = document.getElementById("memes");
        let h = g.previousElementSibling;
        let i = g.nextElementSibling;
        console.log(i);

    </script>
</body>

</html>
