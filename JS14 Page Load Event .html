<body>

    <script>
        // page jb load hota to 2 cheasy triger hoti 1st DOM Content Loaded nam ka event triger hota is ka mtlb ha abi HTML load howa ha 
        // or DOM tree create ho gya ha lkin kisi b trha ke external file ni load hoi jasy css java script images
        // 2nd load event ya us wkt triger ho ga jb sb kuch download ho jay css java script images all

        window.addEventListener("DOMContentLoaded", function () {
            console.log("DOM Content Loaded");
        });

        window.addEventListener("load", function () {
            console.log("Fully Loaded");
        });
