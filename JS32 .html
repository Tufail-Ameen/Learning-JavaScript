        // Iterables and Iterators.

        // Iterators:
        // phly array bnani ha  ...  us ky bad aopr iterator function bnana ha

        // Iterator function
        function fruitsitrator(values) {
            let a = 0;
            // We will return an object           return kr ra 1 asa object jis my next nam ka function ha  
            return {
                next: function () {
                    if (a < values.length) {
                        // We will return below object
                        return {
                            value: values[a++],
                            done: false
                        }
                    }

                    else {
                        // We will return below object with only done    yha done ko is leay {} my likha ku ky 1 obj create ha
                        return {
                            done: true
                        }
                    }

                }
            }
        }

        console.log("My Array is ", Array);
