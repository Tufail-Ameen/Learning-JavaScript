<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRANSITIONS IN CSS:</title>
</head>
<style>
    #box{
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20px;
        font-weight: bold;
        font-family:cursive;
        height: 200px;
        width: 200px;
        border: 4px solid black;
        background-color: gray;
        color: black;
        /* transition-property: background-color;
        transition-duration: 2s;
        transition-timing-function: ease-in;
        transition-delay: 2s; */
        
        transition: all 2s ease-in 0.5s;
    }
    #box:hover{
        background-color: blue;
        height: 400px;
        width: 400px;   
        border-radius: 30px;
        font-size: 45px;
    }
</style>
<body>
    <h3>THIS IS CSS TRANSITIONS</h3>
    <div class="container">
        <div id="box">
            THIS IS MY BOX
        </div>
    </div>

</body>
</html>
