        console.log(result);

        // Type Conversions
        // 1 implicit conversion     js itself will automatically convert the type
        // 2 explicit conversion     you manually convert the type

        // implicit conversion

        console.log("2" + "3")
        // result is 23

        console.log("true" + "3")
        // result is true3

        console.log("4" - "2")
        // result is 2

        console.log("4" * "2")

        console.log("5" - true)

        // explicit conversion

        console.log(Number("5"))
