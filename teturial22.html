<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psuedo selectors and more designing</title>
    <style>
        .container {
            border: 2px solid red;
            background-color: rgb(194, 25, 25);
            padding: 34px;
            margin: 34px auto;
            width: 666px;
        }

        a {
            text-decoration: none;
        }

        a:hover {
            color: white;
            /* background-color: blue; */
        }

        a:visited {
            color: blue;
        }

        a:active {
            background-color: darkviolet;
        }

        .btn {
            background-color: rgb(161, 198, 219);
            padding: 6px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div class="container" id="cont1">
        <h3>This is my heading</h3>
        <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Amet eum repellat, reprehenderit illum beatae ipsam
            molestias minima consectetur nobis laborum similique quisquam atque, quam cupiditate odit aperiam
            dignissimos
            facilis architecto.</p>
        <a href="" class="btn">Read more</a>
        <button class="btn">Contact us</button>
    </div>
</body>
</html>
