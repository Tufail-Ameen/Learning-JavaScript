<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nevigation Menu</title>
    <style>
        .navbar {
            background-color: rgb(19, 18, 18);
            border-radius: 20px;
        }

        .navbar {
            overflow: auto;
        }

        .navbar li {
            float: left;
            list-style: none;
            margin: 2px 10px;
        }

        .navbar li a {
            padding: 13px 20px;
            text-decoration: none;
            color: aliceblue;
        }

        .search {
            padding: 3px 12px;
        }

        .nav2 {
            border: 2px solid white;
            background-color: black;
            border-radius: 25px;
        }

        .nav2 ul {
            overflow: auto;
        }

        .nav2 li {
            float: left;
            list-style: none;
        }

        .nav2 li a {
            margin: 17px;
            padding: 6px;
            color: aliceblue;
            text-decoration: none;
        }
        .nav2 .search {
            color: aliceblue;
            float: right;
        }
        .nav2 input{
            border-radius: 50px;
        }

    </style>
</head>

<body>
    <header>
        <nav class="navbar">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact Us</a></li>
                <div class="search">
                    <input type="text" name="search" id="search" placeholder="search this website">
                </div>
            </ul>
        </nav>
    </header>
    <br>
    <header>
        <nav class="nav2">
            <ul>
                <li><a href="#">About</a></li>
                <li><a href="#">Registration</a></li>
                <li><a href="#">Contact Us</a></li>
                <li><a href="#">Contact Institute</a></li>
                <div class="search">
                    <input type="text" name="search" id="search" placeholder="this this website" >
                </div>
            </ul>
        </nav>
    </header>
</body>
</html>
