        // What is object ?

            salary: 80000,

            channel2: "programmingwithharry"
        }
        console.log(employee);

        // What is Array ?
        // => Array is also a object but a special type of object.

        let names = [1, 2, 3, "harry", undefined]
        console.log(names)

        console.log(names[2])
