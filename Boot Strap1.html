<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
    <style>
      #red{
        background-color: red;
        height: 500px;
      }
      #yellow{
        background-color: yellow;
        height: 100px;
      }

    </style>
  </head>
  <body>
  <!-- Container-fluid hmasha 100% width data ha har 1 device pr -->
   <div class="container-fluid" id="red">
    <!-- row ka width parent container ky brabr hota ha is ky leay abi ap ko bna ky dikhata hn -->
    <!-- content apko colum ky andr lana ha row my lo gy to cut jata aksr contant .contant jb b ho ga colum ky andr e ho ga -->

    <!-- container > row > column > content (text, images) -->
    <!-- column ky andr column ni bna skty -->
    <!-- container > row > column > row > column > content (text, images) -->
    
    <!-- jis point ko ap define kry gy us ky nichy waly sary auto 12 ho jay gy mtlb small 
    or aopr same setting apply ho jati ha large xl -->
    <!-- hm is cheas ko change b kr skty hain -->
    <div class="row" id="yellow">
    <div class="col-sm-6 bg-primary text-white">Col-6</div>
    <div class="col-sm-4 bg-secondary text-white">Col-4</div>
    <div class="col-sm-2 bg-primary text-white">Col-2</div>

    <div class="col-lg-12 bg-danger text-white">Col-12</div>
    
    <!-- hm is cheas ko change b kr skty hain asy -->
    <div class="col-sm-4 col-md-4 bg-primary text-white">Col-4</div>
    <div class="col-sm-3 col-md-4 bg-secondary text-white">Col-3</div>
    <div class="col-sm-5 col-md-4 bg-primary text-white">Col-5</div> 

    <!-- ab column ko agy 3 parts my divide krna ha -->
    <!-- issi ko bolty hain hm nested column -->
    <div class="col-md-4 bg-secondary text-white">Col-4</div>
    <div class="col-md-8 bg-danger text-white">Col-8
      <div class="row">
        <div class="col-sm-4 bg-primary">col 1</div>
        <div class="col-sm-4 bg-secondary">col 2</div>
        <div class="col-sm-4 bg-primary">col 3</div>
      </div>
    </div>
    
    <!-- Short Cuts in bootstrap -->
<!-- number 1:      jb hm ni btay gy 12 my sy kitna kitna hona chahiay to brabr 3 hiso my divide kr dy ga-->

    <div class="row">
      <div class="col bg-danger">equal parts</div>
      <div class="col bg-primary">equal parts</div>
      <div class="col bg-secondary">arshi</div>
    </div>
 
    <!-- number 2: darmyan wala 6 ly ly baki jo 2 parts hain khud e brabr ka bant lain hissa -->

    <div class="row">
      <div class="col bg-danger">auto</div>
      <div class="col-6 bg-secondary">6</div>
      <div class="col bg-primary">auto</div>
    </div>

    <!-- number 3: box my jitna content ha utni space ly baki space baki box my divide kr dy -->
    <!-- USE CALL Auto -->

    <div class="row">
      <div class="col bg-danger">Remaining</div>
      <div class="col-auto bg-secondary">Here i am Tufail</div>
      <div class="col bg-primary">Remaining</div>
    </div>

    <!-- number 4:  is trick my hm is ky col ko ni charty is ke row ko charty hain 
    1 line my kitny column aay gy? -->

    <div class="row row-cols-2">
      <div class="col bg-primary">div 1</div>
      <div class="col bg-secondary">div 2</div>
      <div class="col bg-success">div 3</div>
      <div class="col bg-danger">div 4</div>

      <!-- number 5:   hm chahty hain sb boxes utni space ly jitna content ha us ky andr to ?
      is ky leay b row ko charna ha      row-cols-auto-->

      <div class="row row-cols-auto">
        <div class="col bg-primary">i love you</div>
        <div class="col bg-secondary">i miss you</div>
        <div class="col bg-success">i hate you</div>
        <div class="col bg-danger">i kiss you</div>
    </div>

</div>
</div>

 <!-- Bootstrap my hm color is trha change krty hain -->
 <!-- ya hm bootstrap ka class use kr ky change kry gy color , text style etc -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe" crossorigin="anonymous"></script>
  </body>
</html>
