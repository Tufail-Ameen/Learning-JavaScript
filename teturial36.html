    /* 2nd Method */

    .box {
        font-size: 30px;
        background-color: red;
        width: 250px;
        height: 250px;
        position: relative;

        animation-name: mian2;
        animation-duration: 8s;
        animation-iteration-count: 5;

        animation-timing-function: ease-out;
        animation-delay: 2s;
        animation-direction: reverse;

    }


    @keyframes mian2 {
        0% {
            top: 0px;
            left: 0px;
        }

        25% {
            top: 250px;
            left: 0px;
        }

        75% {
            top: 250px;
            left: 250px;
        }

        100% {
            top: 0px;
            left: 250px;
        }
    }
</style>

        <div class="box">
